<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MDForge</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>MDForge</h2>
        <button id="btn-open">Open File(s)</button>
        <button id="btn-export-all">Export All</button>
      </div>
      <div class="file-list" id="file-list"></div>
      <div class="settings-panel">
        <h3>Settings</h3>
        <label>Theme:
          <select id="setting-theme">
            <option value="default">Default</option>
            <option value="academic">Academic</option>
            <option value="minimal">Minimal</option>
          </select>
        </label>
        <label>PDF Page Size:
          <select id="setting-page-size">
            <option value="A4">A4</option>
            <option value="Letter">Letter</option>
          </select>
        </label>
        <label>PDF Font Size:
          <input type="text" id="setting-font-size" value="16px" placeholder="e.g. 16px">
        </label>
        <label>PDF Margins:
          <input type="text" id="setting-margins" value="20mm" placeholder="e.g. 20mm">
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="setting-auto-open" checked> Auto-open after export
        </label>
      </div>
    </div>

    <div class="editor-pane">
      <div class="tab-bar" id="tab-bar"></div>
      <div id="monaco-container"></div>
    </div>

    <div class="preview-pane">
      <div class="metadata-strip" id="metadata-strip" style="display: none;"></div>
      <div id="preview-container" class="markdown-body"></div>
      <div class="export-actions">
        <button id="btn-export-docx">Export DOCX</button>
        <button id="btn-export-pdf">Export PDF</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="update-banner" class="banner hidden">File updated externally. Click to reload.</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
